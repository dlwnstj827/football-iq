name: Import licensed player photos
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/download_player_photos.py'
      - '.github/workflows/import-player-photos.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/download_player_photos.py
      - name: Commit image assets and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/players/
          if ! git diff --cached --quiet; then
            git commit -m "Import licensed local player images and credits"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
