<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football IQ | 토트넘 사진 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef2ff;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:1100px;margin:auto;padding:22px 16px}h1{font-size:24px;margin:0 0 8px}.sub{color:#aab5c9;margin:0 0 18px}.toolbar{position:sticky;top:0;z-index:3;background:#0b1220ee;padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.toolbar .count{margin-right:auto}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{background:#17243a;border:1px solid #334155;border-radius:14px;overflow:hidden;padding:12px}.photo{height:180px;width:100%;background:#0f172a;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photo span{color:#fca5a5;text-align:center;padding:10px}.name{font-size:17px;font-weight:700;margin:12px 0 4px}.source{font-size:12px;color:#94a3b8;min-height:18px}.buttons{display:flex;gap:6px;margin-top:12px}.buttons button{flex:1;padding:10px 3px;border:1px solid #475569;background:#243449;color:white;border-radius:8px;cursor:pointer;font-weight:700}.buttons button[data-state="ok"].selected{background:#166534}.buttons button[data-state="bad"].selected{background:#991b1b}.buttons button[data-state="hold"].selected{background:#92400e}.card:has(button[data-state="bad"].selected){border-color:#ef4444}#result{white-space:pre-wrap;background:#111b2b;padding:14px;border-radius:10px;margin-top:20px;line-height:1.8}a{color:#93c5fd}</style></head><body><main><h1>⚽ 토트넘 선수 사진 검수</h1><p class="sub">27명 · 사진 높이 180px · 정상 / 오류 / 보류를 눌러 확인하세요. 사진은 게임과 동일하게 저장된 파일을 우선 사용합니다.</p><div class="toolbar"><strong class="count" id="count">검수 0 / 27</strong><button id="copy">오류 목록 복사</button><button id="reset">선택 초기화</button><a href="./play.html">게임으로 돌아가기</a></div><div id="grid"></div><div id="result">오류로 표시한 선수가 여기에 나타납니다.</div></main><script>const players=[{"name":"안토닌 킨스키","wiki":"Antonín Kinský","file":null,"difficulty":"normal"},{"name":"마르틴 두브라브카","wiki":"Martin Dúbravka","file":null,"difficulty":"hard"},{"name":"브랜던 오스틴","wiki":"Brandon Austin (footballer)","file":null,"difficulty":"hard"},{"name":"앤디 로버트슨","wiki":"Andrew Robertson (footballer)","file":null,"difficulty":"easy"},{"name":"토신 아다라비오요","wiki":"Tosin Adarabioyo","file":null,"difficulty":"hard"},{"name":"마르코스 세네시","wiki":"Marcos Senesi","file":null,"difficulty":"hard"},{"name":"얀 파울 판헤케","wiki":"Jan Paul van Hecke","file":null,"difficulty":"normal"},{"name":"데스티니 우도기","wiki":"Destiny Udogie","file":null,"difficulty":"normal"},{"name":"페드로 포로","wiki":"Pedro Porro","file":null,"difficulty":"easy"},{"name":"벤 데이비스","wiki":"Ben Davies (footballer, born 1993)","file":null,"difficulty":"normal"},{"name":"미키 판더펜","wiki":"Micky van de Ven","file":null,"difficulty":"easy"},{"name":"사비 시몬스","wiki":"Xavi Simons","file":null,"difficulty":"easy"},{"name":"코너 갤러거","wiki":"Conor Gallagher","file":null,"difficulty":"normal"},{"name":"제임스 매디슨","wiki":"James Maddison","file":null,"difficulty":"easy"},{"name":"아치 그레이","wiki":"Archie Gray","file":null,"difficulty":"normal"},{"name":"루카스 베리발","wiki":"Lucas Bergvall","file":null,"difficulty":"normal"},{"name":"산드로 토날리","wiki":"Sandro Tonali","file":null,"difficulty":"easy"},{"name":"마테우스 페르난데스","wiki":"Mateus Fernandes","file":null,"difficulty":"normal"},{"name":"모하메드 쿠두스","wiki":"Mohammed Kudus","file":null,"difficulty":"normal"},{"name":"데얀 쿨루세브스키","wiki":"Dejan Kulusevski","file":null,"difficulty":"easy"},{"name":"미하일로 무드리크","wiki":"Mykhailo Mudryk","file":null,"difficulty":"normal"},{"name":"로드리고 벤탄쿠르","wiki":"Rodrigo Bentancur","file":null,"difficulty":"normal"},{"name":"마티스 텔","wiki":"Mathys Tel","file":null,"difficulty":"normal"},{"name":"사비뉴","wiki":"Savinho","file":null,"difficulty":"normal"},{"name":"도미닉 솔란케","wiki":"Dominic Solanke","file":null,"difficulty":"normal"},{"name":"오마르 마르무시","wiki":"Omar Marmoush","file":null,"difficulty":"normal"},{"name":"윌송 오도베르","wiki":"Wilson Odobert","file":null,"difficulty":"hard"}];
const state = {};
const grid = document.getElementById("grid");
function renderResult() {
 const bad = players.filter(p => state[p.name] === "bad").map(p => p.name);
 const hold = players.filter(p => state[p.name] === "hold").map(p => p.name);
 document.getElementById("count").textContent = "검수 " + Object.keys(state).length + " / " + players.length;
 document.getElementById("result").textContent = "사진 오류 (" + bad.length + "명): " + (bad.join(", ") || "없음") + "\n보류 (" + hold.length + "명): " + (hold.join(", ") || "없음");
}
const fixedCommons={
 "Brandon Austin (footballer)":"Brandon Austin in training 25-08-2019.jpeg",
 "Andrew Robertson (footballer)":"Andrew Robertson 2019.jpg",
 "Mateus Fernandes":"Mateus Fernandes 04032026 (3).jpg"
};
const alternateWiki={
 "Antonín Kinský":["Antonín Kinský (footballer, born 2003)","Antonín Kinský (footballer)"],
 "Savinho":["Sávio (footballer, born 2004)","Savinho (footballer)","Sávio Moreira de Oliveira"]
};
async function loadFallback(img,p,photo,source){
 const commons=fixedCommons[p.wiki];
 if(commons){img.onerror=()=>{photo.textContent="사진 불러오기 실패";source.textContent="로드 실패"};img.src="https://commons.wikimedia.org/wiki/Special:Redirect/file/"+encodeURIComponent(commons)+"?width=700";source.textContent="Wikimedia Commons 사진 후보";return;}
 const titles=[p.wiki,...(alternateWiki[p.wiki]||[])];
 for(const title of titles){try{
  const url="https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(title)+"&prop=pageimages&format=json&piprop=thumbnail&pithumbsize=700&origin=*";
  const res=await fetch(url);if(!res.ok)continue;const data=await res.json();const page=Object.values(data.query.pages)[0];if(!page?.thumbnail?.source)continue;
  await new Promise((resolve,reject)=>{const probe=new Image();probe.onload=resolve;probe.onerror=reject;probe.src=page.thumbnail.source});
  img.onerror=()=>{photo.textContent="사진 불러오기 실패";source.textContent="로드 실패"};img.src=page.thumbnail.source;source.textContent="위키백과 사진 후보: "+title;return;
 }catch(e){}}
 photo.textContent="사진 불러오기 실패";source.textContent="로드 실패";
}
players.forEach((p, i) => {
 const card = document.createElement("article");
 card.className = "card";
 const photo = document.createElement("div");
 photo.className = "photo";
 const img = document.createElement("img");
 img.alt = p.name + " 사진";
 img.loading = "lazy";
 const source = document.createElement("div");
 source.className = "source";
 source.textContent = "위키백과 사진 후보 (미검수)";
 img.onerror = () => {
  
  loadFallback(img, p, photo, source);
 };
 if(p.file)img.src="./images/players/"+p.file;else loadFallback(img,p,photo,source);
 photo.appendChild(img);
 const title = document.createElement("div");
 title.className = "name";
 title.textContent = (i + 1) + ". " + p.name;
 const buttons = document.createElement("div");
 buttons.className = "buttons";
 [["ok","정상"],["bad","오류"],["hold","보류"]].forEach(([value, label]) => {
  const button = document.createElement("button");
  button.dataset.state = value;
  button.textContent = label;
  button.addEventListener("click", () => {
   state[p.name] = value;
   buttons.querySelectorAll("button").forEach(b => b.classList.toggle("selected", b.dataset.state === value));
   renderResult();
  });
  buttons.appendChild(button);
 });
 
 card.append(photo, title, source, buttons);
 grid.appendChild(card);
});
document.getElementById("copy").addEventListener("click", async () => {
 const value = document.getElementById("result").textContent;
 try { await navigator.clipboard.writeText(value); alert("오류 목록을 복사했어!"); }
 catch(e) { prompt("아래 내용을 복사해 줘", value); }
});
document.getElementById("reset").addEventListener("click", () => {
 Object.keys(state).forEach(key => delete state[key]);
 document.querySelectorAll(".selected").forEach(button => button.classList.remove("selected"));
 renderResult();
});
renderResult();</script></body></html>
