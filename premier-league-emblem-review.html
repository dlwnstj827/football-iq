<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football IQ | PL 엠블럼 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#edf2fa;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1120px;margin:auto;padding:32px 18px}h1{margin:0 0 10px}p{color:#aebbd1;line-height:1.6}.summary{position:sticky;top:0;background:#16243a;padding:13px;border-radius:12px;z-index:2;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:#17243a;border:1px solid #35435b;border-radius:14px;padding:16px}.image{height:190px;background:white;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:18px}.image img{width:100%;height:100%;object-fit:contain}.missing{color:#a11;text-align:center}.name{font-weight:700;margin:12px 0 4px}.meta{color:#aebbd1;font-size:13px}.buttons{display:flex;gap:6px;margin:12px 0}.buttons button{flex:1;border:1px solid #52637a;background:#25354f;color:white;border-radius:7px;padding:10px 3px;cursor:pointer}.buttons button.active{background:#176d5a;border-color:#5de3bc}.buttons button[data-v="error"].active{background:#a93244}.buttons button[data-v="hold"].active{background:#88651b}.links a{color:#93c5fd;font-size:12px;margin-right:8px}textarea{width:100%;border:1px solid #52637a;background:#0b1729;color:white;border-radius:7px;padding:8px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}button.action{background:#2563eb;color:white;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}small{color:#aebbd1}</style></head><body><main><h1>⚽ 프리미어리그 엠블럼 검수</h1><p>선택한 20개 구단의 엠블럼을 확인해 줘. 정상 / 오류 / 보류를 누르면 이 브라우저에 자동 저장돼. 이미지는 위키피디아 API에서 임시로 가져오며, 아직 사이트 내부 저장이나 라이선스 검토가 끝난 상태는 아니야.</p><div class="summary" id="summary"></div><div class="actions"><button class="action" id="copy">검수 결과 복사</button><button class="action" id="download">검수 결과 JSON 저장</button></div><div class="grid" id="grid"></div></main><script>const clubs=[["아스널","Arsenal F.C.","easy"],["애스턴 빌라","Aston Villa F.C.","easy"],["본머스","AFC Bournemouth","normal"],["브렌트퍼드","Brentford F.C.","normal"],["브라이턴","Brighton & Hove Albion F.C.","normal"],["첼시","Chelsea F.C.","easy"],["코번트리 시티","Coventry City F.C.","easy"],["크리스털 팰리스","Crystal Palace F.C.","normal"],["에버턴","Everton F.C.","normal"],["풀럼","Fulham F.C.","normal"],["헐 시티","Hull City A.F.C.","normal"],["입스위치 타운","Ipswich Town F.C.","normal"],["리즈 유나이티드","Leeds United F.C.","normal"],["리버풀","Liverpool F.C.","easy"],["맨체스터 시티","Manchester City F.C.","easy"],["맨체스터 유나이티드","Manchester United F.C.","easy"],["뉴캐슬 유나이티드","Newcastle United F.C.","normal"],["노팅엄 포레스트","Nottingham Forest F.C.","normal"],["선덜랜드","Sunderland A.F.C.","normal"],["토트넘 홋스퍼","Tottenham Hotspur F.C.","easy"]];const key='footballiq-pl-crest-review-v1';let reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(key,JSON.stringify(reviews));renderSummary()}function renderSummary(){const c={ok:0,error:0,hold:0};Object.values(reviews).forEach(x=>{if(c[x.status]!==undefined)c[x.status]++});document.getElementById('summary').textContent='총 20팀 · 정상 '+c.ok+' · 오류 '+c.error+' · 보류 '+c.hold+' · 미검수 '+(20-c.ok-c.error-c.hold)}function update(i,v){const name=clubs[i][0];reviews[name]={...(reviews[name]||{}),status:v};persist();document.querySelectorAll('[data-i="'+i+'"] button[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v))}function render(){document.getElementById('grid').innerHTML=clubs.map(([name,wiki,level],i)=>'<section class="card" data-i="'+i+'"><div class="image"><span class="missing">엠블럼 불러오는 중…</span></div><div class="name">'+(i+1)+'. '+esc(name)+'</div><div class="meta">난이도: '+(level==='easy'?'하':'중')+'</div><div class="buttons">'+[['ok','정상'],['error','오류'],['hold','보류']].map(([v,label])=>'<button data-v="'+v+'" class="'+(reviews[name]?.status===v?'active':'')+'" onclick="update('+i+',\''+v+'\')">'+label+'</button>').join('')+'</div><textarea rows="2" placeholder="메모 (선택)" oninput="note('+i+',this.value)">'+esc(reviews[name]?.note||'')+'</textarea><div class="links"><a href="https://en.wikipedia.org/wiki/'+encodeURIComponent(wiki)+'" target="_blank" rel="noopener">위키피디아 확인</a><a href="https://commons.wikimedia.org/wiki/Special:MediaSearch?type=image&search='+encodeURIComponent(wiki+' logo')+'" target="_blank" rel="noopener">공용 이미지 검색</a></div></section>').join('');renderSummary();clubs.forEach((c,i)=>load(i,c[1]))}function note(i,value){const name=clubs[i][0];reviews[name]={...(reviews[name]||{}),note:value};persist()}async function load(i,title){const target=document.querySelector('[data-i="'+i+'"] .image');try{const api='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=original%7Cthumbnail&pithumbsize=500&titles='+encodeURIComponent(title);const data=await(await fetch(api)).json();const page=Object.values(data.query?.pages||{})[0];const src=page?.thumbnail?.source||page?.original?.source;if(!src)throw Error('위키피디아 대표 이미지 없음');const img=document.createElement('img');img.alt=title+' 대표 이미지';img.src=src;img.onerror=()=>{target.innerHTML='<span class="missing">이미지 로딩 실패</span>'};target.replaceChildren(img);const note=document.createElement('small');note.textContent='※ 대표 이미지가 엠블럼인지 확인 필요';target.parentElement.insertBefore(note,target.nextSibling)}catch(e){target.innerHTML='<span class="missing">이미지 불러오기 실패 — 오류로 표시해 줘</span>'}}function report(){return clubs.map(([name,,level])=>name+': '+(reviews[name]?.status==='ok'?'정상':reviews[name]?.status==='error'?'오류':reviews[name]?.status==='hold'?'보류':'미검수')+' ('+(level==='easy'?'하':'중')+')'+(reviews[name]?.note?' — '+reviews[name].note:'')).join('\n')}document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report());alert('검수 결과 복사 완료! 채팅에 붙여넣어 줘.')}catch{prompt('아래 결과를 복사해 줘',report())}};document.getElementById('download').onclick=()=>{const blob=new Blob([JSON.stringify({clubs,reviews},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pl-crest-review.json';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
