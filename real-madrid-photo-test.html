<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football IQ | 레알 마드리드 사진 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef2ff;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:1100px;margin:auto;padding:22px 16px}h1{font-size:24px;margin:0 0 8px}.sub{color:#aab5c9;margin:0 0 18px}.toolbar{position:sticky;top:0;z-index:3;background:#0b1220ee;padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.toolbar .count{margin-right:auto}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{background:#17243a;border:1px solid #334155;border-radius:14px;overflow:hidden;padding:12px}.photo{height:180px;width:100%;background:#0f172a;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photo span{color:#fca5a5;text-align:center;padding:10px}.name{font-size:17px;font-weight:700;margin:12px 0 4px}.source{font-size:12px;color:#94a3b8;min-height:18px}.buttons{display:flex;gap:6px;margin-top:12px}.buttons button{flex:1;padding:10px 3px;border:1px solid #475569;background:#243449;color:white;border-radius:8px;cursor:pointer;font-weight:700}.buttons button[data-state="ok"].selected{background:#166534}.buttons button[data-state="bad"].selected{background:#991b1b}.buttons button[data-state="hold"].selected{background:#92400e}.card:has(button[data-state="bad"].selected){border-color:#ef4444}#result{white-space:pre-wrap;background:#111b2b;padding:14px;border-radius:10px;margin-top:20px;line-height:1.8}a{color:#93c5fd}</style></head><body><main><h1>⚽ 레알 마드리드 선수 사진 검수</h1><p class="sub">18명 · 사진 높이 180px · 정상 / 오류 / 보류를 눌러 확인하세요. 사진은 게임과 동일하게 저장된 파일을 우선 사용합니다.</p><div class="toolbar"><strong class="count" id="count">검수 0 / 18</strong><button id="copy">오류 목록 복사</button><button id="reset">선택 초기화</button><a href="./play.html">게임으로 돌아가기</a></div><div id="grid"></div><div id="result">오류로 표시한 선수가 여기에 나타납니다.</div></main><script>const players=[{"name":"안드리 루닌","wiki":"Andriy Lunin","file":"player-118.webp"},{"name":"라울 아센시오","wiki":"Raúl Asencio","file":"player-119.webp"},{"name":"에데르 밀리탕","wiki":"Éder Militão","file":"player-120.webp"},{"name":"딘 하위선","wiki":"Dean Huijsen","file":"player-121.webp"},{"name":"이브라히마 코나테","wiki":"Ibrahima Konaté","file":"player-122.webp"},{"name":"마르크 쿠쿠레야","wiki":"Marc Cucurella","file":"player-123.webp"},{"name":"알바로 카레라스","wiki":"Álvaro Carreras","file":"player-124.webp"},{"name":"안토니오 뤼디거","wiki":"Antonio Rüdiger","file":"player-125.webp"},{"name":"페를랑 멘디","wiki":"Ferland Mendy","file":"player-126.webp"},{"name":"덴젤 둠프리스","wiki":"Denzel Dumfries","file":"player-127.webp"},{"name":"에두아르도 카마빙가","wiki":"Eduardo Camavinga","file":"player-128.webp"},{"name":"오렐리앵 추아메니","wiki":"Aurélien Tchouaméni","file":"player-129.webp"},{"name":"아르다 귈러","wiki":"Arda Güler","file":"player-130.webp"},{"name":"호드리구","wiki":"Rodrygo","file":"player-132.webp"},{"name":"엔드리키","wiki":"Endrick (footballer, born 2006)","file":"player-133.webp"},{"name":"브라힘 디아스","wiki":"Brahim Díaz","file":"player-134.webp"},{"name":"얀 디오망데","wiki":"Yan Diomande","file":"player-135.webp"},{"name":"카를로스 에스피","wiki":"Carlos Espí","file":"player-136.webp"}];const state={};const grid=document.getElementById("grid");function renderResult(){const bad=players.filter(p=>state[p.name]==="bad").map(p=>p.name);const hold=players.filter(p=>state[p.name]==="hold").map(p=>p.name);document.getElementById("count").textContent="검수 "+Object.keys(state).length+" / "+players.length;document.getElementById("result").textContent="사진 오류 ("+bad.length+"명): "+(bad.join(", ")||"없음")+"\n보류 ("+hold.length+"명): "+(hold.join(", ")||"없음")}players.forEach((p,i)=>{const c=document.createElement("article");c.className="card";const photo=document.createElement("div");photo.className="photo";const img=document.createElement("img");img.alt=p.name+" 사진";img.loading="lazy";const source=document.createElement("div");source.className="source";source.textContent="사진 확인 중...";const fallback=async()=>{source.textContent="위키백과 대체 사진";try{const u="https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(p.wiki)+"&prop=pageimages&format=json&piprop=thumbnail&pithumbsize=700&origin=*";const d=await (await fetch(u)).json();const page=Object.values(d.query.pages)[0];if(page.thumbnail?.source)img.src=page.thumbnail.source;else{photo.textContent="사진 없음";source.textContent="사진 로드 실패"}}catch{photo.textContent="사진 불러오기 실패";source.textContent="로드 실패"}}};img.onerror=()=>{if(source.textContent==="저장된 사진")fallback();else{photo.textContent="사진 불러오기 실패";source.textContent="로드 실패"}};img.onload=()=>{if(source.textContent==="사진 확인 중...")source.textContent="저장된 사진"};img.src="./images/players/"+p.file;photo.append(img);const title=document.createElement("div");title.className="name";title.textContent=(i+1)+". "+p.name;const buttons=document.createElement("div");buttons.className="buttons";[["ok","정상"],["bad","오류"],["hold","보류"]].forEach(([v,label])=>{const b=document.createElement("button");b.dataset.state=v;b.textContent=label;b.onclick=()=>{state[p.name]=v;buttons.querySelectorAll("button").forEach(x=>x.classList.toggle("selected",x.dataset.state===v));renderResult()};buttons.append(b)});c.append(photo,title,source,buttons);grid.append(c)});document.getElementById("copy").onclick=async()=>{const text=document.getElementById("result").textContent;try{await navigator.clipboard.writeText(text);alert("오류 목록을 복사했어!") }catch{prompt("아래 내용을 복사해 줘",text)}};document.getElementById("reset").onclick=()=>{Object.keys(state).forEach(k=>delete state[k]);document.querySelectorAll(".selected").forEach(x=>x.classList.remove("selected"));renderResult()};renderResult();</script></body></html>
