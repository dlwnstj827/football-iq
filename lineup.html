<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라인업으로 구단 맞히기 | Football IQ</title><style>
:root{--bg:#071b17;--mint:#c6ff72;--muted:#afc3b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#21503a,var(--bg) 65%);color:#f5f8f1;font-family:system-ui,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.shell{max-width:980px;margin:auto;padding:25px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:900;font-size:21px}.logo span{color:var(--mint)}.back{color:var(--muted);font-size:14px}h1{font-size:clamp(29px,5vw,46px);margin:35px 0 8px}.sub{color:var(--muted);line-height:1.65;margin-bottom:24px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}.pitch{position:relative;min-height:580px;padding:25px 22px;display:flex;flex-direction:column;justify-content:space-around;border:2px solid #8ab58d;border-radius:22px;overflow:hidden;background:repeating-linear-gradient(0deg,#1a5137 0 64px,#205b3e 64px 128px);box-shadow:0 20px 60px #0005}.pitch:before{content:"";position:absolute;inset:16px;border:2px solid #ffffff6b;pointer-events:none}.pitch:after{content:"";position:absolute;left:50%;top:50%;width:155px;height:155px;border:2px solid #ffffff5c;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.half{position:absolute;top:50%;left:16px;right:16px;border-top:2px solid #ffffff5c}.line{display:flex;justify-content:space-around;gap:8px;z-index:1}.num{width:clamp(39px,7vw,55px);height:clamp(39px,7vw,55px);border-radius:50%;background:#f7fff2;color:#103b26;display:grid;place-items:center;font-weight:900;font-size:19px;box-shadow:0 5px 13px #0005;border:3px solid #c6ff72}.panel{background:#112e25;border:1px solid #345642;border-radius:18px;padding:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--mint)}.progress{font-size:26px;font-weight:900;margin:8px 0 16px}.meta{color:var(--muted);font-size:13px;line-height:1.8;margin:14px 0}.choice{display:block;width:100%;margin:10px 0;padding:14px 16px;text-align:left;border-radius:12px;border:1px solid #547660;background:#193c2e;color:white;font-weight:800;font-size:16px;cursor:pointer}.choice:hover:not(:disabled){border-color:var(--mint)}.choice:disabled{opacity:.7;cursor:default}.choice.correct{background:#326c37;border-color:#c6ff72}.choice.wrong{background:#743d39;border-color:#f4a19b}.feedback{min-height:54px;line-height:1.6;font-size:14px;margin:18px 0;color:#dceadd}.next{width:100%;padding:14px;border:0;border-radius:12px;background:var(--mint);font-weight:900;color:#102b1e;cursor:pointer;font-size:15px}.next:disabled{opacity:.35;cursor:default}.source{color:#a4bbac;font-size:12px;line-height:1.7;margin-top:18px}.source a{text-decoration:underline}.footnote{color:var(--muted);font-size:13px;margin-top:20px;line-height:1.7}@media(max-width:720px){.layout{grid-template-columns:1fr}.pitch{min-height:460px}.panel{padding:18px}.shell{padding:16px 14px 45px}}</style></head><body><main class="shell"><header class="top"><a class="logo" href="./index.html">FOOTBALL <span>IQ.</span></a><a class="back" href="./index.html">← 홈으로</a></header><h1>라인업으로 구단 맞히기</h1><p class="sub">실제 경기 선발 11명의 등번호와 포메이션만 보고 구단을 맞혀봐! 현재는 2문제 수동 등록 테스트 버전이야.</p><section class="layout"><div class="pitch" id="pitch" aria-label="선발 11명 등번호 포메이션"></div><aside class="panel"><div class="eyebrow">GUESS THE CLUB · TEST</div><div class="progress" id="progress">1 / 2</div><div class="meta" id="meta"></div><div id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" disabled>다음 문제 →</button><div class="source">출처: <a href="https://www.skysports.com/football/liverpool-vs-arsenal/teams/8206828602449165232" target="_blank" rel="noopener">Sky Sports 경기 선발 명단</a><br>2026년 11월 1일 경기 기준</div></aside></section><p class="footnote">※ 경기 정보는 실제 기록을 바탕으로 수동 등록했으며, 자동 업데이트는 아직 적용하지 않았어. 정답을 선택하면 해당 구단이 공개돼.</p></main><script>
const games=[
{answer:"리버풀",date:"2026.11.01",formation:"4-2-3-1",lines:[[9],[18,7,29],[10,42],[6,4,5,33],[1]]},
{answer:"아스널",date:"2026.11.01",formation:"4-2-3-1",lines:[[29],[17,8,20],[41,39],[33,6,15,12],[1]]}
];let index=0,score=0,answered=false;const el=id=>document.getElementById(id);
function render(){answered=false;const g=games[index];el("progress").textContent=(index+1)+" / "+games.length;el("meta").textContent="포메이션 "+g.formation+" · "+g.date+" 경기";el("pitch").innerHTML='<div class="half"></div>'+g.lines.map(line=>'<div class="line">'+line.map(n=>'<div class="num">'+n+'</div>').join("")+'</div>').join("");el("feedback").textContent="어느 구단의 선발 라인업일까?";el("next").disabled=true;el("next").textContent=index===games.length-1?"결과 보기":"다음 문제 →";el("choices").innerHTML="";["리버풀","아스널","맨체스터 시티","첼시"].forEach(name=>{const b=document.createElement("button");b.className="choice";b.textContent=name;b.onclick=()=>guess(name);el("choices").append(b)})}
function guess(name){if(answered)return;answered=true;const right=name===games[index].answer;if(right)score++;for(const b of el("choices").children){b.disabled=true;if(b.textContent===games[index].answer)b.classList.add("correct");else if(b.textContent===name)b.classList.add("wrong")}el("feedback").textContent=right?"정답! "+name+"의 선발 라인업이야.":"아쉬워! 정답은 "+games[index].answer+"이야.";el("next").disabled=false}
el("next").onclick=()=>{if(index<games.length-1){index++;render()}else{el("progress").textContent="테스트 완료";el("feedback").textContent="최종 점수: "+score+" / "+games.length;el("choices").innerHTML="";el("next").textContent="다시 플레이";el("next").disabled=false;el("next").onclick=()=>{index=0;score=0;location.reload()}}};render();
</script></body></html>
