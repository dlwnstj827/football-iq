<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사진 검토 테스트 | Football IQ</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#071c15;color:#f3f7f2;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}main{max-width:950px;margin:auto;padding:24px 16px 80px}a{color:#a2e8b5}h1{margin:10px 0}p{color:#c4d7ca;line-height:1.6}.panel{background:#123024;border:1px solid #37654a;border-radius:18px;padding:20px;margin:18px 0}.progress{font-weight:800;color:#b6f0bf}.photo{display:block;width:100%;height:min(60vh,530px);object-fit:contain;background:#07160f;border-radius:14px;margin:16px auto}.controls{display:flex;gap:10px;flex-wrap:wrap}.controls button{flex:1;min-width:130px;padding:14px 12px;border:1px solid #6b9877;border-radius:12px;background:#244d33;color:white;font:inherit;font-weight:800;cursor:pointer}.controls button.active{background:#b4f0c3;color:#102818}.controls button:disabled{opacity:.4;cursor:default}.name{font-size:23px;font-weight:800;margin:6px 0}.small{font-size:13px}.summary{white-space:pre-wrap;background:#0a2017;padding:15px;border-radius:12px;line-height:1.8}textarea{width:100%;min-height:180px;background:#0a2017;color:white;border:1px solid #58866b;border-radius:12px;padding:12px;font:inherit}button.primary{background:#b4f0c3;color:#102818}#done{display:none}@media(max-width:600px){.photo{height:48vh}.controls button{min-width:100px}}
</style></head><body><main><a href="./index.html">← Football IQ 홈</a><h1>사진 32장 검토 테스트</h1><p>자동 검사에서 추가 확인이 필요한 사진 32장을 <strong>한 장씩 순서대로</strong> 확인해 줘. 정답을 맞히는 게임이 아니라, 사진에 <strong>해당 선수 한 명만 나오는지</strong> 검사하는 전용 페이지야. 난이도·시간제한·10문제 제한은 없어.</p><div class="panel" id="review"><div class="progress" id="progress"></div><div class="name" id="name"></div><p class="small" id="detector"></p><img class="photo" id="photo" alt="검토할 선수 사진"><div class="controls"><button id="good">한 명만 나옴 ✓</button><button id="bad">다른 사람도 나옴 ✕</button><button id="unclear">판단 어려움 ?</button></div><div class="controls" style="margin-top:12px"><button id="prev">← 이전</button><button id="next">다음 →</button></div><p class="small">선택하면 자동으로 다음 사진으로 넘어가. 이전 버튼으로 답을 수정할 수 있어.</p></div><div class="panel" id="done"><h2>32장 검토 완료!</h2><p>아래 결과를 복사해서 채팅에 붙여 넣어 줘. 사진 교체가 필요한 선수를 확인할게.</p><div class="summary" id="summary"></div><div class="controls" style="margin-top:12px"><button class="primary" id="copy">결과 복사</button><button id="restart">처음부터 다시 보기</button></div></div></main><script>
const items=[{"name":"모하메드 살라","photo":"salah.webp","faces":2},{"name":"안드레아 피를로","photo":"player-015.webp","faces":0},{"name":"라민 야말","photo":"player-021.webp","faces":2},{"name":"베르나르두 실바","photo":"player-030.webp","faces":3},{"name":"플로리안 비르츠","photo":"player-032.webp","faces":3},{"name":"라우타로 마르티네스","photo":"player-036.webp","faces":2},{"name":"잔루이지 돈나룸마","photo":"player-040.webp","faces":2},{"name":"펠레","photo":"player-041.webp","faces":4},{"name":"디에고 마라도나","photo":"player-042.webp","faces":2},{"name":"프란츠 베켄바워","photo":"player-044.webp","faces":3},{"name":"카를레스 푸욜","photo":"player-048.webp","faces":2},{"name":"토니 크로스","photo":"player-055.webp","faces":2},{"name":"잔루이지 부폰","photo":"player-057.webp","faces":2},{"name":"사무엘 에토","photo":"player-059.webp","faces":0},{"name":"버질 판데이크","photo":"player-062.webp","faces":2},{"name":"알리송 베케르","photo":"player-063.webp","faces":3},{"name":"티보 쿠르투아","photo":"player-064.webp","faces":3},{"name":"알렉시스 맥 알리스터","photo":"player-069.webp","faces":4},{"name":"우스만 뎀벨레","photo":"player-071.webp","faces":0},{"name":"마르퀴뇨스","photo":"player-074.webp","faces":2},{"name":"마누엘 노이어","photo":"player-075.webp","faces":3},{"name":"이강인","photo":"player-077.webp","faces":2},{"name":"루드 굴리트","photo":"player-079.webp","faces":2},{"name":"알레산드로 델 피에로","photo":"player-081.webp","faces":2},{"name":"바스티안 슈바인슈타이거","photo":"player-085.webp","faces":3},{"name":"메수트 외질","photo":"player-089.webp","faces":2},{"name":"야야 투레","photo":"player-091.webp","faces":2},{"name":"다비드 비야","photo":"player-100.webp","faces":2},{"name":"차비 에르난데스","photo":"player-047.webp","faces":0},{"name":"로베르토 카를루스","photo":"player-060.webp","faces":6},{"name":"김민재","photo":"player-076.webp","faces":3},{"name":"미셸 플라티니","photo":"player-078.webp","faces":2}];
const answers=Array(items.length).fill(null);let index=0;
const $=id=>document.getElementById(id);
function render(){if(index>=items.length){finish();return}const item=items[index];$("review").style.display="block";$("done").style.display="none";$("progress").textContent=(index+1)+" / "+items.length;$("name").textContent=item.name;$("detector").textContent="자동 검사 감지 얼굴 수: "+item.faces+"개 (참고용)";$("photo").src="./images/players/"+item.photo;$("photo").alt=item.name+" 사진";$("prev").disabled=index===0;$("next").textContent=index===items.length-1?"결과 보기 →":"다음 →";for(const [id,value] of [["good","good"],["bad","bad"],["unclear","unclear"]])$(id).classList.toggle("active",answers[index]===value)}
function answer(value){answers[index]=value;index++;render()}
$("good").onclick=()=>answer("good");$("bad").onclick=()=>answer("bad");$("unclear").onclick=()=>answer("unclear");$("prev").onclick=()=>{index=Math.max(0,index-1);render()};$("next").onclick=()=>{index++;render()};
function resultText(){const groups=[["다른 사람도 나옴","bad"],["판단 어려움","unclear"],["한 명만 나옴","good"],["미검토","null"]];return "Football IQ 사진 32장 검토 결과\n"+groups.map(([label,value])=>{const found=items.filter((p,i)=>String(answers[i])===value);return label+" ("+found.length+"명): "+(found.map(x=>x.name).join(", ")||"없음")}).join("\n")}
function finish(){$("review").style.display="none";$("done").style.display="block";$("summary").textContent=resultText();window.scrollTo(0,0)}
$("copy").onclick=async()=>{const text=resultText();try{await navigator.clipboard.writeText(text);$("copy").textContent="복사 완료 ✓"}catch(e){const area=document.createElement("textarea");area.value=text;document.body.append(area);area.select();document.execCommand("copy");area.remove();$("copy").textContent="복사 완료 ✓"}};
$("restart").onclick=()=>{index=0;render()};render();
</script></body></html>
