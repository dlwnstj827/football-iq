<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레알 마드리드 사진 테스트 | Football IQ</title><style>*{box-sizing:border-box}body{margin:0;background:#071b17;color:#f4f9ef;font-family:system-ui,sans-serif}header,main{max-width:1100px;margin:auto;padding:22px}h1{margin:12px 0}p{color:#b0c1b4;line-height:1.6}.stats{position:sticky;top:0;background:#0d2a22;border-bottom:1px solid #315341;padding:12px;z-index:2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}.card{background:#123127;border:1px solid #315341;border-radius:16px;overflow:hidden}.card.ok{border:2px solid #baf87d}.card.bad{border:2px solid #ff8585}.photo{height:250px;background:#183d2d;display:grid;place-items:center;position:relative}.photo img{width:100%;height:100%;object-fit:contain}.photo span{padding:14px;text-align:center;color:#b0c1b4}.info{padding:14px}.name{font-weight:800;margin-bottom:5px}.source{font-size:12px;color:#b0c1b4;min-height:18px}.actions{display:flex;gap:8px;margin-top:12px}button{cursor:pointer;border:1px solid #51785d;border-radius:9px;padding:10px;background:#1b4230;color:white;flex:1;font-weight:700}.ok button.yes,.bad button.no{background:#c6ff72;color:#102719}.bad button.no{background:#ff8585;color:#291111}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 22px}.toolbar button{flex:none}a{color:#c6ff72}.small{font-size:12px}</style></head><body><header><a href="play.html">← 게임으로 돌아가기</a><h1>⚽ 레알 마드리드 선수 사진 테스트</h1><p>새로 추가한 18명의 사진을 한 번에 확인해. <b>정확함</b> 또는 <b>오류</b>를 선택하고, 아래의 결과 복사 버튼을 누르면 수정할 선수 목록을 보낼 수 있어. 사진은 현재 게임과 동일하게 로컬 이미지가 연결돼 있으면 우선 사용하고, 아니면 위키백과 이미지를 불러와.</p></header><div class="stats"><main style="padding:0"><strong id="count">검사 중…</strong> <span class="small"> · 선택 결과는 이 브라우저에서 유지됨</span></main></div><main><div class="toolbar"><button id="copy">검사 결과 복사</button><button id="retry">사진 다시 불러오기</button><button id="clear">판정 초기화</button></div><div id="grid" class="grid"></div></main><script>const players=[{"name":"안드리 루닌","wiki":"Andriy Lunin","file":"player-118.webp"},{"name":"라울 아센시오","wiki":"Raúl Asencio","file":"player-119.webp"},{"name":"에데르 밀리탕","wiki":"Éder Militão","file":"player-120.webp"},{"name":"딘 하위선","wiki":"Dean Huijsen","file":"player-121.webp"},{"name":"이브라히마 코나테","wiki":"Ibrahima Konaté","file":"player-122.webp"},{"name":"마르크 쿠쿠레야","wiki":"Marc Cucurella","file":"player-123.webp"},{"name":"알바로 카레라스","wiki":"Álvaro Carreras","file":"player-124.webp"},{"name":"안토니오 뤼디거","wiki":"Antonio Rüdiger","file":"player-125.webp"},{"name":"페를랑 멘디","wiki":"Ferland Mendy","file":"player-126.webp"},{"name":"덴젤 둠프리스","wiki":"Denzel Dumfries","file":"player-127.webp"},{"name":"에두아르도 카마빙가","wiki":"Eduardo Camavinga","file":"player-128.webp"},{"name":"오렐리앵 추아메니","wiki":"Aurélien Tchouaméni","file":"player-129.webp"},{"name":"아르다 귈러","wiki":"Arda Güler","file":"player-130.webp"},{"name":"호드리구","wiki":"Rodrygo","file":"player-132.webp"},{"name":"엔드리키","wiki":"Endrick (footballer, born 2006)","file":"player-133.webp"},{"name":"브라힘 디아스","wiki":"Brahim Díaz","file":"player-134.webp"},{"name":"얀 디오망데","wiki":"Yan Diomande","file":"player-135.webp"},{"name":"카를로스 에스피","wiki":"Carlos Espí","file":"player-136.webp"}];const key="football-iq-real-photo-review-v1";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch{}const grid=document.getElementById("grid");function save(){localStorage.setItem(key,JSON.stringify(state));drawCount()}function drawCount(){let ok=0,bad=0;for(const p of players){if(state[p.wiki]==="ok")ok++;if(state[p.wiki]==="bad")bad++}document.getElementById("count").textContent="전체 "+players.length+"명 · 정확 "+ok+"명 · 오류 "+bad+"명 · 미확인 "+(players.length-ok-bad)+"명"}function mark(wiki,value){state[wiki]=value;save();const card=[...grid.children].find(x=>x.dataset.wiki===wiki);if(card){card.classList.toggle("ok",value==="ok");card.classList.toggle("bad",value==="bad")}}async function exists(url){try{const r=await fetch(url,{method:"HEAD"});return r.ok&&r.headers.get("content-type")?.startsWith("image/")}catch{return false}}async function getPhoto(p){const local="./images/players/"+p.file;if(await exists(local))return {src:local,source:"사이트 저장 사진"};const api="https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(p.wiki)+"&prop=pageimages&format=json&piprop=thumbnail%7Coriginal&pithumbsize=700&origin=*";const res=await fetch(api);if(!res.ok)throw Error("위키백과 API 오류");const data=await res.json(),page=Object.values(data.query?.pages||{})[0],src=page?.thumbnail?.source||page?.original?.source;if(!src)throw Error("사진을 찾지 못함");return {src,source:"위키백과 사진 (게임 대체 이미지)"}}function makeCard(p){const card=document.createElement("article");card.className="card";card.dataset.wiki=p.wiki;card.innerHTML='<div class="photo"><span>사진 불러오는 중…</span></div><div class="info"><div class="name"></div><div class="source"></div><div class="actions"><button class="yes">✓ 정확함</button><button class="no">✕ 오류</button></div></div>';card.querySelector(".name").textContent=p.name;card.querySelector(".yes").onclick=()=>mark(p.wiki,"ok");card.querySelector(".no").onclick=()=>mark(p.wiki,"bad");grid.appendChild(card);mark(p.wiki,state[p.wiki]);loadCard(card,p);return card}async function loadCard(card,p){const photo=card.querySelector(".photo"),label=card.querySelector(".source");photo.innerHTML="<span>사진 불러오는 중…</span>";try{const result=await getPhoto(p);const img=new Image();img.alt=p.name+" 사진";img.referrerPolicy="no-referrer";img.onload=()=>{photo.replaceChildren(img)};img.onerror=()=>{photo.innerHTML="<span>이미지 로드 실패</span>";label.textContent="사진 오류 · "+result.source};img.src=result.src;label.textContent=result.source}catch(e){photo.innerHTML="<span>사진 불러오기 실패</span>";label.textContent=String(e.message)}}for(const p of players)makeCard(p);document.getElementById("retry").onclick=()=>{for(let i=0;i<players.length;i++)loadCard(grid.children[i],players[i])};document.getElementById("clear").onclick=()=>{state={};save();for(const p of players)mark(p.wiki,undefined)};document.getElementById("copy").onclick=async()=>{const bad=players.filter(p=>state[p.wiki]==="bad").map(p=>p.name);const pending=players.filter(p=>!state[p.wiki]);const message="Football IQ 레알 마드리드 사진 테스트 결과: 오류 "+(bad.length?bad.join(", "):"없음")+" / 미확인 "+(pending.length?pending.map(p=>p.name).join(", "):"없음")+". 오류 선수 사진을 수정해줘.";try{await navigator.clipboard.writeText(message);alert("결과를 복사했어! 채팅에 붙여넣어 줘.")}catch{prompt("아래 결과를 복사해 줘",message)}};drawCount();</script></body></html>
