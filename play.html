<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071b17"><title>선수 사진 맞히기 | Football IQ</title>
<style>:root{color-scheme:dark;--bg:#071b17;--panel:#123127;--line:#315341;--mint:#c6ff72;--muted:#b0c1b4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 0,#24543b,transparent 65%),var(--bg);color:#f5f8f1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(850px,calc(100% - 32px));margin:auto}header{border-bottom:1px solid #ffffff24}.nav{height:76px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.brand span{color:var(--mint)}.back{color:var(--muted);font-size:14px}main{padding:64px 0 90px}.eyebrow{color:var(--mint);font-size:12px;letter-spacing:2px;font-weight:900}h1{font-size:clamp(34px,6vw,56px);letter-spacing:-2px;margin:12px 0}p{color:var(--muted);line-height:1.7}.panel{margin-top:34px;border:1px solid var(--line);background:linear-gradient(145deg,#1a4230,#0d2922);border-radius:24px;padding:clamp(22px,5vw,40px)}h2{margin:0 0 8px;font-size:23px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.choice{border:1px solid #4c725b;background:#0d2a22;color:white;border-radius:16px;min-height:135px;cursor:pointer;padding:17px;text-align:left;font:inherit;transition:.15s}.choice strong{display:block;font-size:18px;margin:12px 0 5px}.choice small{color:var(--muted)}.choice[aria-pressed=true]{border:2px solid var(--mint);background:#27513a}.choice:focus-visible,.start:focus-visible{outline:3px solid white;outline-offset:3px}.rules{border-top:1px solid #ffffff20;padding-top:18px;margin-top:6px;color:var(--muted);font-size:14px;line-height:2}.start{width:100%;background:var(--mint);color:#11271a;border:0;border-radius:14px;padding:17px;font-size:17px;font-weight:900;cursor:pointer;margin-top:22px}.notice{margin-top:14px;font-size:13px;text-align:center}.hidden{display:none!important}.topline{display:flex;justify-content:space-between;gap:15px;font-weight:800}.timer{color:var(--mint)}.photo{height:420px;display:grid;place-items:center;background:repeating-linear-gradient(0deg,#194732 0 48px,#20513a 48px 96px);border:1px solid #5a8062;border-radius:18px;margin:22px 0;overflow:hidden}.photo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center center}.photo .fallback{text-align:center;padding:18px;color:#e8f5e4}.answer{width:100%;background:#082019;border:1px solid #52775e;border-radius:12px;padding:16px;color:white;font:inherit;font-size:17px}.feedback{min-height:28px;margin-top:12px;font-weight:800}.summary{font-size:34px;color:var(--mint);font-weight:900}.missed{padding-left:20px;line-height:1.9;color:var(--muted)}@media(max-width:600px){main{padding-top:40px}.choices{grid-template-columns:1fr}.choice{min-height:86px}.choice strong{margin:4px 0}.photo{height:340px}}</style></head>
<body><header><nav class="nav wrap"><a class="brand" href="./index.html">FOOTBALL <span>IQ.</span></a><a class="back" href="./index.html">← 홈으로</a></nav></header><main class="wrap">
<div id="setup"><div class="eyebrow">PLAYER PHOTO QUIZ</div><h1>선수 사진 맞히기</h1><p>사진 속 축구 선수의 이름을 7초 안에 맞혀 봐!</p><section class="panel"><h2>어떤 선수들로 도전할래?</h2><p>원하는 출제 범위를 선택해 줘.</p><div class="choices" role="group" aria-label="선수 출제 범위"><button class="choice" data-pool="current" aria-pressed="false"><span>⚡</span><strong>현역 선수</strong><small>현재 활동 중인 스타들</small></button><button class="choice" data-pool="legend" aria-pressed="false"><span>🏆</span><strong>레전드</strong><small>은퇴한 전설적인 선수들</small></button><button class="choice" data-pool="all" aria-pressed="true"><span>🌍</span><strong>전체</strong><small>현역 + 레전드</small></button></div><div class="rules">✓ 총 10문제 · 문제당 7초<br>✓ 맞힌 문제 수로 결과 표시<br>✓ 한글 또는 영어 이름으로 입력 가능</div><button class="start" id="start">게임 시작하기 →</button><p class="notice">베타 버전 · 선수 사진은 외부 이미지 제공 상태에 따라 표시되지 않을 수 있어.</p></section></div>
<section class="panel hidden" id="quiz" aria-live="polite"><div class="topline"><span id="progress">1 / 10</span><span>정답 <span id="score">0</span>개</span><span class="timer" id="timer">7초</span></div><div class="photo" id="photo"><span>사진 준비 중…</span></div><form id="form"><label for="answer">선수 이름</label><input id="answer" class="answer" placeholder="선수 이름 입력" autocomplete="off" required><button class="start" id="submit" type="submit">정답 제출</button></form><div class="feedback" id="feedback" role="status"></div><button id="skip" class="back" type="button" style="background:none;border:0;cursor:pointer;padding:10px 0">모르겠어요 · 다음 문제</button></section>
<section class="panel hidden" id="results"><div class="eyebrow">FULL TIME</div><h2>경기 종료!</h2><div class="summary" id="finalScore"></div><p id="finalDesc"></p><h3>틀린 문제</h3><ol id="missed" class="missed"></ol><button class="start" id="again">다시 도전하기</button></section>
</main><script>
const players=[
{n:"리오넬 메시",a:["메시","리오넬메시","lionelmessi","messi"],pool:"current",wiki:"Lionel Messi"},
{n:"크리스티아누 호날두",a:["호날두","크리스티아누호날두","cristianoronaldo","cr7"],pool:"current",wiki:"Cristiano Ronaldo"},
{n:"킬리안 음바페",a:["음바페","킬리안음바페","kylianmbappe","mbappe"],pool:"current",wiki:"Kylian Mbappé"},
{n:"엘링 홀란",a:["홀란","홀란드","엘링홀란","erlinghaaland","haaland"],pool:"current",wiki:"Erling Haaland"},
{n:"손흥민",a:["손흥민","sonheungmin","heungminson","son"],pool:"current",wiki:"Son Heung-min"},
{n:"모하메드 살라",a:["살라","모하메드살라","mohamedsalah","salah"],pool:"current",wiki:"Mohamed Salah"},
{n:"해리 케인",a:["케인","해리케인","harrykane","kane"],pool:"current",wiki:"Harry Kane"},
{n:"주드 벨링엄",a:["벨링엄","주드벨링엄","judebellingham","bellingham"],pool:"current",wiki:"Jude Bellingham"},
{n:"비니시우스 주니오르",a:["비니시우스","비니시우스주니오르","viniciusjunior","vinicius"],pool:"current",wiki:"Vinícius Júnior"},
{n:"케빈 더 브라위너",a:["더브라위너","데브라위너","케빈더브라위너","케빈데브라위너","덕배","kevindebruyne","debruyne","debruyner"],pool:"current",wiki:"Kevin De Bruyne"},
{n:"지네딘 지단",a:["지단","지네딘지단","zinedinezidane","zidane"],pool:"legend",wiki:"Zinedine Zidane"},
{n:"호나우지뉴",a:["호나우지뉴","ronaldinho"],pool:"legend",wiki:"Ronaldinho"},
{n:"호나우두",a:["호나우두","브라질호나우두","ronaldo","ronaldonazario","r9"],pool:"legend",wiki:"Ronaldo (Brazilian footballer)"},
{n:"데이비드 베컴",a:["베컴","데이비드베컴","davidbeckham","beckham"],pool:"legend",wiki:"David Beckham"},
{n:"안드레아 피를로",a:["피를로","안드레아피를로","andreapirlo","pirlo"],pool:"legend",wiki:"Andrea Pirlo"},
{n:"카카",a:["카카","kaka","kaká"],pool:"legend",wiki:"Kaká"},
{n:"티에리 앙리",a:["앙리","티에리앙리","thierryhenry","henry"],pool:"legend",wiki:"Thierry Henry"},
{n:"스티븐 제라드",a:["제라드","스티븐제라드","stevengerrard","gerrard"],pool:"legend",wiki:"Steven Gerrard"},
{n:"프랭크 램파드",a:["램파드","프랭크램파드","franklampard","lampard"],pool:"legend",wiki:"Frank Lampard"},
{n:"웨인 루니",a:["루니","웨인루니","waynerooney","rooney"],pool:"legend",wiki:"Wayne Rooney"}
];
const $=id=>document.getElementById(id);let pool="all",questions=[],index=0,score=0,missed=[],interval=null,locked=false,token=0,skipped=0;
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{pool=b.dataset.pool;document.querySelectorAll(".choice").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))});
function show(id){["setup","quiz","results"].forEach(x=>$(x).classList.toggle("hidden",x!==id))}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f\s.\-_'’]/g,"")}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function begin(){questions=shuffle(players.filter(p=>pool==="all"||p.pool===pool).slice()).slice(0,10);index=0;score=0;missed=[];skipped=0;$("score").textContent="0";show("quiz");next()}
async function next(){clearInterval(interval);locked=false;let t=++token;if(index>=questions.length){finish();return}const p=questions[index];$("progress").textContent=(index+1)+" / "+questions.length;$("timer").textContent="준비 중";$("feedback").textContent="";$("answer").value="";$("answer").disabled=true;$("submit").disabled=true;$("photo").innerHTML="<span>선수 사진 불러오는 중…</span>";
try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),6500);let res;try{res=await fetch("https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(p.wiki)+"&prop=pageimages&format=json&piprop=original%7Cthumbnail&pithumbsize=900&origin=*",{signal:controller.signal})}finally{clearTimeout(timeout)}if(!res.ok)throw Error("API");const data=await res.json();const page=Object.values(data.query.pages)[0];if(!page.original?.source&&!page.thumbnail?.source)throw Error("사진 없음");const img=new Image();img.alt="축구 선수 사진";img.referrerPolicy="no-referrer";await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=page.original?.source||page.thumbnail.source});if(t!==token)return;$("photo").replaceChildren(img);$("answer").disabled=false;$("submit").disabled=false;$("answer").focus();let left=7;$("timer").textContent=left+"초";interval=setInterval(()=>{left--;$("timer").textContent=left+"초";if(left<=0)judge(false,"시간 초과!")},1000)}
catch(e){if(t!==token)return;$("photo").innerHTML='<div class="fallback">⚠️ 사진을 불러오지 못했어.<br>재시도하거나 이 문제를 건너뛸 수 있어.<br><button type="button" id="retry" class="start">다시 불러오기</button><button type="button" id="pass" class="back" style="display:block;margin:12px auto;background:none;border:0;color:white;cursor:pointer">이 문제 건너뛰기</button></div>';$("retry").onclick=next;$("pass").onclick=()=>{skipped++;index++;next()};$("feedback").textContent="인터넷 또는 사진 제공 서버를 확인해 줘."}}
function judge(correct,msg){if(locked)return;locked=true;clearInterval(interval);$("answer").disabled=true;$("submit").disabled=true;const p=questions[index];if(correct){score+=1;$("score").textContent=score}else missed.push(p.n);$("feedback").textContent=msg;setTimeout(()=>{index++;next()},1100)}
$("form").onsubmit=e=>{e.preventDefault();if(locked||$("answer").disabled)return;const p=questions[index];const ok=p.a.some(a=>norm(a)===norm($("answer").value));judge(ok,ok?"정답! 🎉":"오답! 정답: "+p.n)};
$("skip").onclick=()=>{if(!$("answer").disabled&&!locked)judge(false,"정답: "+questions[index].n)};
function finish(){clearInterval(interval);show("results");$("finalScore").textContent="10문제 중 "+score+"문제 정답";$("finalDesc").textContent="정답 "+score+"개 · 오답 "+missed.length+"개"+(skipped?" · 사진 오류로 건너뜀 "+skipped+"개":"");$("missed").replaceChildren(...(missed.length?missed.map(n=>{const li=document.createElement("li");li.textContent=n;return li}):[Object.assign(document.createElement("li"),{textContent:"틀린 문제가 없어! 🎉"})]))}
$("start").onclick=begin;$("again").onclick=()=>{show("setup")};
</script></body></html>
