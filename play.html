async function tryLocalPhoto(p){
 const filename=localPhotoPaths[p.wiki];
 if(!filename)return null;
 const url="./images/players/"+filename;
 try{
  const response=await fetch(url,{method:"HEAD",cache:"default"});
  if(!response.ok||!response.headers.get("content-type")?.startsWith("image/"))return null;
  const img=new Image();
  await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error("local image timeout")),4000);img.onload=()=>{clearTimeout(timeout);resolve()};img.onerror=()=>{clearTimeout(timeout);reject(Error("local image error"))};img.src=url});
  return url;
 }catch{return null}
}
async function fetchPhoto(p){
 if(photoCache.has(p.wiki))return photoCache.get(p.wiki);
 const local=await tryLocalPhoto(p);
 if(local){photoCache.set(p.wiki,local);return local;}
 const url="https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(p.wiki)+"&prop=pageimages&format=json&piprop=thumbnail%7Coriginal&pithumbsize=700&origin=*";
 let sources=[];
 for(let attempt=0;attempt<2;attempt++){
  try{
   const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),9000);
   let res;try{res=await fetch(url,{signal:controller.signal,cache:"default"})}finally{clearTimeout(timeout)}
   if(!res.ok)throw Error("Wikipedia API "+res.status);
   const data=await res.json(),page=Object.values(data.query?.pages||{})[0];
   sources=[page?.thumbnail?.source,page?.original?.source].filter(Boolean);
   if(sources.length)break;
  }catch(e){if(attempt===1)console.warn("사진 정보 실패",p.n,e)}
 }
 for(const src of [...new Set(sources)]){
  try{
   const img=new Image();img.alt="축구 선수 사진";img.referrerPolicy="no-referrer";
   await new Promise((resolve,reject)=>{
    const timeout=setTimeout(()=>{img.onload=null;img.onerror=null;reject(Error("image timeout"))},9000);
    img.onload=()=>{clearTimeout(timeout);resolve()};
    img.onerror=()=>{clearTimeout(timeout);reject(Error("image error"))};
    img.src=src;
   });
   photoCache.set(p.wiki,src);return src;
  }catch(e){console.warn("사진 주소 실패",p.n,e)}
 }
 throw Error("No usable photo: "+p.n);
}
async function next(){
 clearInterval(interval);locked=false;const t=++token;
 if(index>=questions.length){finish();return}
 $("progress").textContent=(index+1)+" / "+questions.length;
 $("timer").textContent="준비 중";$("feedback").textContent="";
 $("answer").value="";$("answer").disabled=true;$("submit").disabled=true;
 $("photo").innerHTML="<span>선수 사진 불러오는 중…</span>";
 let tried=0;
 while(t===token){
  const p=questions[index];
  try{
   const src=await fetchPhoto(p);
   if(t!==token)return;
   const img=new Image();img.alt="축구 선수 사진";img.src=src;
   $("photo").replaceChildren(img);
   $("answer").disabled=false;$("submit").disabled=false;$("answer").focus();
   let left=7;$("timer").textContent=left+"초";
   interval=setInterval(()=>{left--;$("timer").textContent=left+"초";if(left<=0)judge(false,"시간 초과!")},1000);
   return;
  }catch(e){
   if(t!==token)return;
   console.warn("선수 사진 교체",p.n,e);
   if(spares.length&&tried<4){
    questions[index]=spares.shift();tried++;
    $("photo").innerHTML="<span>사진 연결이 불안정해 다른 선수를 준비 중…</span>";
    continue;
   }
   $("timer").textContent="사진 오류";
   $("photo").innerHTML='<div class="fallback">⚠️ 사진을 불러오지 못했어.<br>재시도하거나 이 문제를 건너뛸 수 있어.<br><button type="button" id="retry" class="start">다시 불러오기</button><button type="button" id="pass" class="back" style="display:block;margin:12px auto;background:none;border:0;color:white;cursor:pointer">이 문제 건너뛰기</button></div>';
   $("retry").onclick=next;
   $("pass").onclick=()=>{skipped++;index++;next()};
   $("feedback").textContent="사진 서버에 연결할 수 없어. 이 문제는 오답 처리되지 않아.";
   return;
  }
 }
}
function judge(correct,msg){if(locked)return;locked=true;clearInterval(interval);$("answer").disabled=true;$("submit").disabled=true;const p=questions[index];if(correct){score+=1;$("score").textContent=score}else missed.push(p.n);const overlay=$("resultOverlay");overlay.className="result-overlay "+(correct?"correct":"wrong");$("resultIcon").textContent=correct?"✅":"❌";$("resultTitle").textContent=correct?"정답!":msg==="시간 초과!"?"시간 초과!":"오답!";$("resultName").textContent=correct?p.n:"정답: "+p.n;advanceTimeout=setTimeout(()=>{overlay.classList.add("hidden");index++;next()},1500)}
$("form").onsubmit=e=>{e.preventDefault();if(locked||$("answer").disabled)return;const p=questions[index];const ok=p.a.some(a=>norm(a)===norm($("answer").value));judge(ok,ok?"정답! 🎉":"오답! 정답: "+p.n)};
$("skip").onclick=()=>{if(!$("answer").disabled&&!locked)judge(false,"정답: "+questions[index].n)};
function finish(){clearInterval(interval);$("resultOverlay").classList.add("hidden");show("results");$("finalScore").textContent=questions.length+"문제 중 "+score+"문제 정답";$("finalDesc").textContent="정답 "+score+"개 · 오답 "+missed.length+"개"+(skipped?" · 사진 오류로 건너뜀 "+skipped+"개":"");$("missed").replaceChildren(...(missed.length?missed.map(n=>{const li=document.createElement("li");li.textContent=n;return li}):[Object.assign(document.createElement("li"),{textContent:"틀린 문제가 없어! 🎉"})]))}
$("start").onclick=begin;$("again").onclick=()=>{show("setup")};
