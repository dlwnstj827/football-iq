<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선수 사진 출처 | Football IQ</title><style>body{font-family:system-ui;background:#071b17;color:#f5f8f1;max-width:820px;margin:36px auto;padding:0 20px;line-height:1.7}a{color:#c6ff72}li{margin:18px 0;padding-bottom:12px;border-bottom:1px solid #315341}</style></head><body><p><a href="./play.html">← 게임으로 돌아가기</a></p><h1>선수 사진 출처 및 라이선스</h1><p>내부 저장된 사진의 원본, 저작자, 라이선스와 변경 내용을 표시합니다. 등록되지 않은 사진은 위키백과에서 불러옵니다.</p><ul id="credits"><li>출처 정보를 불러오는 중…</li></ul><script>fetch("./images/players/credits.json").then(r=>{if(!r.ok)throw Error();return r.json()}).then(rows=>{const list=document.getElementById("credits");list.replaceChildren();if(!rows.length){list.textContent="아직 내부 등록된 사진이 없습니다.";return}for(const x of rows){const li=document.createElement("li");const strong=document.createElement("strong");strong.textContent=x.player;li.append(strong,document.createElement("br"));li.append("저작자: "+x.author+" · 라이선스: "+x.license+" · "+x.modified+" ");for(const [label,url] of [["원본",x.source],["라이선스",x.license_url]])if(url){const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=" ["+label+"]";li.append(a)}list.append(li)}}).catch(()=>document.getElementById("credits").textContent="내부 사진 출처 목록은 아직 준비 중입니다.")</script></body></html>
