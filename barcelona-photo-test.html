<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football IQ | 바르셀로나 사진 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef2ff;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:1100px;margin:auto;padding:22px 16px}h1{font-size:24px;margin:0 0 8px}.sub{color:#aab5c9;margin:0 0 18px}.toolbar{position:sticky;top:0;z-index:3;background:#0b1220ee;padding:12px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}.toolbar .count{margin-right:auto}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}.card{background:#17243a;border:1px solid #334155;border-radius:14px;overflow:hidden;padding:12px}.photo{height:180px;width:100%;background:#0f172a;border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.photo span{color:#fca5a5;text-align:center;padding:10px}.name{font-size:17px;font-weight:700;margin:12px 0 4px}.source{font-size:12px;color:#94a3b8;min-height:18px}.buttons{display:flex;gap:6px;margin-top:12px}.buttons button{flex:1;padding:10px 3px;border:1px solid #475569;background:#243449;color:white;border-radius:8px;cursor:pointer;font-weight:700}.buttons button[data-state="ok"].selected{background:#166534}.buttons button[data-state="bad"].selected{background:#991b1b}.buttons button[data-state="hold"].selected{background:#92400e}.card:has(button[data-state="bad"].selected){border-color:#ef4444}#result{white-space:pre-wrap;background:#111b2b;padding:14px;border-radius:10px;margin-top:20px;line-height:1.8}a{color:#93c5fd}</style></head><body><main><h1>⚽ 바르셀로나 선수 사진 검수</h1><p class="sub">19명 · 사진 높이 180px · 정상 / 오류 / 보류를 눌러 확인하세요. 사진은 게임과 동일하게 저장된 파일을 우선 사용합니다.</p><div class="toolbar"><strong class="count" id="count">검수 0 / 19</strong><button id="copy">오류 목록 복사</button><button id="reset">선택 초기화</button><a href="./play.html">게임으로 돌아가기</a></div><div id="grid"></div><div id="result">오류로 표시한 선수가 여기에 나타납니다.</div></main><script>const players=[{"name":"조안 가르시아","wiki":"Joan García","file":"player-137.webp","difficulty":"hard"},{"name":"보이치에흐 슈체스니","wiki":"Wojciech Szczęsny","file":"player-138.webp","difficulty":"normal"},{"name":"주앙 칸셀루","wiki":"João Cancelo","file":"player-139.webp","difficulty":"easy"},{"name":"파우 쿠바르시","wiki":"Pau Cubarsí","file":"player-141.webp","difficulty":"easy"},{"name":"안드레아스 크리스텐센","wiki":"Andreas Christensen","file":"player-143.webp","difficulty":"normal"},{"name":"쥘 쿤데","wiki":"Jules Koundé","file":"player-145.webp","difficulty":"normal"},{"name":"에릭 가르시아","wiki":"Eric García","file":"player-146.webp","difficulty":"hard"},{"name":"가비","wiki":"Gavi (footballer)","file":"player-023.webp","difficulty":"normal"},{"name":"페르민 로페스","wiki":"Fermín López","file":"player-147.webp","difficulty":"normal"},{"name":"페드리","wiki":"Pedri","file":"player-022.webp","difficulty":"easy"},{"name":"로드리","wiki":"Rodri (footballer, born 1996)","file":"player-031.webp","difficulty":"easy"},{"name":"다니 올모","wiki":"Dani Olmo","file":"player-148.webp","difficulty":"normal"},{"name":"프렝키 더용","wiki":"Frenkie de Jong","file":"player-149.webp","difficulty":"normal"},{"name":"마르크 베르날","wiki":"Marc Bernal","file":"player-150.webp","difficulty":"hard"},{"name":"가브리에우 제주스","wiki":"Gabriel Jesus","file":"player-151.webp","difficulty":"easy"},{"name":"라민 야말","wiki":"Lamine Yamal","file":"player-021.webp","difficulty":"easy"},{"name":"하피냐","wiki":"Raphinha","file":"player-024.webp","difficulty":"easy"},{"name":"앤서니 고든","wiki":"Anthony Gordon","file":"player-153.webp","difficulty":"normal"},{"name":"루니 바르드지","wiki":"Roony Bardghji","file":"player-154.webp","difficulty":"hard"}];
const state = {};
const grid = document.getElementById("grid");
function renderResult() {
 const bad = players.filter(p => state[p.name] === "bad").map(p => p.name);
 const hold = players.filter(p => state[p.name] === "hold").map(p => p.name);
 document.getElementById("count").textContent = "검수 " + Object.keys(state).length + " / " + players.length;
 document.getElementById("result").textContent = "사진 오류 (" + bad.length + "명): " + (bad.join(", ") || "없음") + "\n보류 (" + hold.length + "명): " + (hold.join(", ") || "없음");
}
async function loadFallback(img, p, photo, source) {
 source.textContent = "위키백과 대체 사진";
 try {
  const url = "https://en.wikipedia.org/w/api.php?action=query&titles=" + encodeURIComponent(p.wiki) + "&prop=pageimages&format=json&piprop=thumbnail&pithumbsize=700&origin=*";
  const res = await fetch(url);
  const data = await res.json();
  const page = Object.values(data.query.pages)[0];
  if (!page || !page.thumbnail) throw new Error("No photo");
  img.onerror = () => { photo.textContent = "사진 불러오기 실패"; source.textContent = "로드 실패"; };
  img.src = page.thumbnail.source;
 } catch(e) {
  photo.textContent = "사진 불러오기 실패";
  source.textContent = "로드 실패";
 }
}
players.forEach((p, i) => {
 const card = document.createElement("article");
 card.className = "card";
 const photo = document.createElement("div");
 photo.className = "photo";
 const img = document.createElement("img");
 img.alt = p.name + " 사진";
 img.loading = "lazy";
 const source = document.createElement("div");
 source.className = "source";
 source.textContent = "저장된 사진 우선";
 img.onerror = () => {
  if(p.wiki==="Xavi Espart"){
    photo.textContent="로컬 사진 미확보 · 아래 공식 선수 프로필에서 확인";
    source.textContent="FC 바르셀로나 공식 사진 · 재사용 권한 미확인";
    return;
  }
  loadFallback(img, p, photo, source);
 };
 img.src = "./images/players/" + p.file;
 photo.appendChild(img);
 const title = document.createElement("div");
 title.className = "name";
 title.textContent = (i + 1) + ". " + p.name;
 const buttons = document.createElement("div");
 buttons.className = "buttons";
 [["ok","정상"],["bad","오류"],["hold","보류"]].forEach(([value, label]) => {
  const button = document.createElement("button");
  button.dataset.state = value;
  button.textContent = label;
  button.addEventListener("click", () => {
   state[p.name] = value;
   buttons.querySelectorAll("button").forEach(b => b.classList.toggle("selected", b.dataset.state === value));
   renderResult();
  });
  buttons.appendChild(button);
 });
 if(p.wiki==="Xavi Espart"){
  const link=document.createElement("a");
  link.href="https://www.fcbarcelona.com/en/football/first-team/players/141001/xavi-espart";
  link.target="_blank";link.rel="noopener noreferrer";
  link.textContent="사비 에스파르트 공식 프로필 사진 확인 ↗";
  link.style.cssText="display:block;font-size:13px;margin:8px 0";
  card.appendChild(link);
 }
 card.append(photo, title, source, buttons);
 grid.appendChild(card);
});
document.getElementById("copy").addEventListener("click", async () => {
 const value = document.getElementById("result").textContent;
 try { await navigator.clipboard.writeText(value); alert("오류 목록을 복사했어!"); }
 catch(e) { prompt("아래 내용을 복사해 줘", value); }
});
document.getElementById("reset").addEventListener("click", () => {
 Object.keys(state).forEach(key => delete state[key]);
 document.querySelectorAll(".selected").forEach(button => button.classList.remove("selected"));
 renderResult();
});
renderResult();</script></body></html>
