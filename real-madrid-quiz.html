<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football IQ | 레알 마드리드 실전 테스트</title>
<style>
:root{color-scheme:dark;--bg:#071b17;--panel:#123127;--line:#315341;--mint:#c6ff72;--muted:#b0c1b4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#173c2c 0%,var(--bg) 60%);color:#f5fff8;font-family:system-ui,"Malgun Gothic",sans-serif}
main{max-width:680px;margin:auto;padding:25px 16px 50px}a{color:var(--mint)}h1{font-size:26px;margin:12px 0 8px}.intro{color:var(--muted);line-height:1.6;margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 16px 38px #0003}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.stat{color:var(--muted);font-weight:700}
.track{height:8px;background:#294a38;border-radius:10px;margin:14px 0 20px;overflow:hidden}.fill{height:100%;background:var(--mint);width:0;transition:width .2s}
.photo{width:100%;height:min(55vw,350px);min-height:210px;max-height:350px;background:#0a1913;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{height:100%;width:100%;object-fit:contain}.photo span{color:#fca5a5;text-align:center}
input{display:block;width:100%;padding:14px;border-radius:10px;border:1px solid #4a7058;background:#091c14;color:white;font-size:18px;margin:16px 0 10px}
button{cursor:pointer;border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:750}.primary{background:var(--mint);color:#102114}.secondary{background:#30513f;color:white}.buttons{display:flex;gap:9px;flex-wrap:wrap}.buttons button{flex:1}.feedback{min-height:48px;margin:13px 0 0;line-height:1.6;font-weight:700}.good{color:#c6ff72}.bad{color:#ffb0a8}.hidden{display:none!important}.end{text-align:center;padding:26px 0}.end h2{font-size:27px}.small{font-size:13px;color:var(--muted);margin-top:14px}
</style></head><body><main><a href="./play.html">← Football IQ 메인 게임</a><h1>⚽ 레알 마드리드 선수 퀴즈</h1><p class="intro">사진을 보고 선수 이름을 입력해 봐! 이번에 검수한 13명만 출제하며 난이도 구분 없이 무작위 순서로 진행돼.</p>
<section class="panel"><div id="game"><div class="row"><strong id="progress">1 / 13</strong><span class="stat" id="timer">7초</span><span class="stat" id="score">정답 0개</span></div><div class="track"><div id="fill" class="fill"></div></div><div class="photo" id="photo"><span>사진 불러오는 중...</span></div><form id="answerForm" autocomplete="off"><input id="answer" aria-label="선수 이름" placeholder="선수 이름 입력" required><div class="buttons"><button class="primary" id="submit" type="submit">정답 확인</button><button class="secondary hidden" id="next" type="button">다음 문제 →</button></div></form><p class="feedback" id="feedback" aria-live="polite"></p><p class="small">실제 게임처럼 7초 제한이며 정답을 입력하고 Enter를 누르면 자동으로 다음 문제로 넘어가.</p><button id="skip" class="secondary" type="button">이 문제 건너뛰기</button></div><div id="finish" class="end hidden"><h2>퀴즈 완료!</h2><p id="summary"></p><button class="primary" id="again" type="button">다시 플레이</button></div></section>
</main><script>
const players=[{"n":"에데르 밀리탕","a":["에데르 밀리탕","밀리탕","밀리타오","에데르 밀리타오","eder militao"],"wiki":"Éder Militão","file":"player-120.webp"},{"n":"딘 하위선","a":["딘 하위선","하위선","휘센","딘 휘센","dean huijsen"],"wiki":"Dean Huijsen","file":"player-121.webp"},{"n":"이브라히마 코나테","a":["이브라히마 코나테","코나테","이브라히마 코나떼","ibrahima konate"],"wiki":"Ibrahima Konaté","file":"player-122.webp"},{"n":"마르크 쿠쿠레야","a":["마르크 쿠쿠레야","쿠쿠레야","쿠쿠렐라","마크 쿠쿠렐라","marc cucurella"],"wiki":"Marc Cucurella","file":"player-123.webp"},{"n":"알바로 카레라스","a":["알바로 카레라스","카레라스","알바로 카레라스 페르난데스","alvaro carreras"],"wiki":"Álvaro Carreras","file":"player-124.webp"},{"n":"안토니오 뤼디거","a":["안토니오 뤼디거","뤼디거","루디거","안토니오 루디거","antonio rudiger"],"wiki":"Antonio Rüdiger","file":"player-125.webp"},{"n":"페를랑 멘디","a":["페를랑 멘디","멘디","페를란 멘디","ferland mendy"],"wiki":"Ferland Mendy","file":"player-126.webp"},{"n":"에두아르도 카마빙가","a":["에두아르도 카마빙가","카마빙가","에두아르두 카마빙가","eduardo camavinga"],"wiki":"Eduardo Camavinga","file":"player-128.webp"},{"n":"오렐리앵 추아메니","a":["오렐리앵 추아메니","추아메니","오렐리앙 추아메니","aurelien tchouameni"],"wiki":"Aurélien Tchouaméni","file":"player-129.webp"},{"n":"아르다 귈러","a":["아르다 귈러","귈러","굴레르","귈레르","아르다 굴레르","arda guler"],"wiki":"Arda Güler","file":"player-130.webp"},{"n":"호드리구","a":["호드리구","로드리고","호드리고","rodrygo","rodrygo goes"],"wiki":"Rodrygo","file":"player-132.webp"},{"n":"브라힘 디아스","a":["브라힘 디아스","브라힘","브라힘 디아즈","브라임 디아스","brahim diaz"],"wiki":"Brahim Díaz","file":"player-134.webp"},{"n":"얀 디오망데","a":["얀 디오망데","디오망데","얀 디오만데","yan diomande"],"wiki":"Yan Diomande","file":"player-135.webp"}];
let order=[],index=0,score=0,answered=false,advanceTimer=null,countdown=null,seconds=7;
const el=id=>document.getElementById(id);
const normalize=value=>value.toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9가-힣]/g,"");
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
async function fallback(p,img){try{const url="https://en.wikipedia.org/w/api.php?action=query&titles="+encodeURIComponent(p.wiki)+"&prop=pageimages&format=json&piprop=thumbnail&pithumbsize=700&origin=*";const response=await fetch(url);const data=await response.json();const page=Object.values(data.query.pages)[0];if(!page||!page.thumbnail)throw Error("No photo");img.onerror=()=>{el("photo").textContent="사진을 불러오지 못했어. 건너뛰기를 눌러줘.";};img.src=page.thumbnail.source}catch{el("photo").textContent="사진을 불러오지 못했어. 건너뛰기를 눌러줘."}}
function show(){clearTimeout(advanceTimer);clearInterval(countdown);answered=false;const p=order[index];el("progress").textContent=(index+1)+" / "+order.length;el("score").textContent="정답 "+score+"개";el("fill").style.width=(index/order.length*100)+"%";el("answer").value="";el("answer").dataset.composing="false";el("answer").disabled=false;el("submit").classList.remove("hidden");el("next").classList.add("hidden");el("skip").classList.remove("hidden");el("feedback").textContent="";el("feedback").className="feedback";const photo=el("photo");photo.replaceChildren();const img=document.createElement("img");img.alt="누구인지 맞혀 보세요";img.onerror=()=>fallback(p,img);img.src="./images/players/"+p.file+"?v=2";photo.append(img);el("answer").focus();seconds=7;el("timer").textContent=seconds+"초";countdown=setInterval(()=>{if(answered){clearInterval(countdown);return}if(document.activeElement===el("answer")&&el("answer").matches(":focus")&&el("answer").dataset.composing==="true")return;seconds--;el("timer").textContent=seconds+"초";if(seconds<=0)finishQuestion(false,false,true)},1000)}
function finishQuestion(correct,skipped=false,timedOut=false){if(answered)return;answered=true;clearInterval(countdown);const p=order[index];if(correct)score++;el("score").textContent="정답 "+score+"개";el("feedback").textContent=correct?"정답! "+p.n:skipped?"건너뛰기 · 정답: "+p.n:timedOut?"시간 초과! 정답: "+p.n:"아쉬워! 정답: "+p.n;el("feedback").className="feedback "+(correct?"good":"bad");el("answer").disabled=true;el("submit").classList.add("hidden");el("next").classList.remove("hidden");el("next").textContent=index===order.length-1?"결과 보기":"다음 문제 →";el("skip").classList.add("hidden");advanceTimer=setTimeout(goNext,1500)}
function submitAnswer(){if(answered||el("answer").disabled)return;const p=order[index];const input=normalize(el("answer").value.trim());if(!input)return;finishQuestion(p.a.concat(p.n).some(alias=>normalize(alias)===input))}
el("answerForm").addEventListener("submit",event=>{event.preventDefault();submitAnswer()});
el("answer").addEventListener("compositionstart",()=>{el("answer").dataset.composing="true"});
el("answer").addEventListener("compositionend",()=>{el("answer").dataset.composing="false"});
el("answer").addEventListener("keydown",event=>{if(event.key!=="Enter")return;event.preventDefault();if(event.isComposing||el("answer").dataset.composing==="true")return;submitAnswer()});
el("submit").addEventListener("click",event=>{event.preventDefault();submitAnswer()});
el("skip").addEventListener("click",()=>finishQuestion(false,true));
function goNext(){clearTimeout(advanceTimer);index++;if(index>=order.length){el("game").classList.add("hidden");el("finish").classList.remove("hidden");el("summary").textContent="총 "+order.length+"문제 중 "+score+"문제 정답 · 정답률 "+Math.round(score/order.length*100)+"%";return}show()}
el("next").addEventListener("click",goNext);
function start(){clearTimeout(advanceTimer);clearInterval(countdown);order=shuffle(players.slice());index=0;score=0;el("game").classList.remove("hidden");el("finish").classList.add("hidden");show()}
el("again").addEventListener("click",start);start();
</script></body></html>
